{% extends "app/base.html" %}

{% block titulo%}Nuevo Ingrediente{% endblock%}

{% block contenido %}

<form method="POST">
    {% csrf_token %}

    {{ formularios.management_form }}

    {% for form in formularios %}
        {{ form.as_p }}
    {% endfor %}

    <button type="submit">Guardar Cambios</button>

    <a href="{% url 'ingredientes_lista' %}">Volver a la Lista</a>
</form>

{% endblock contenido %}
